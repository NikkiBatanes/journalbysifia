name: Hourly Notification Triggers

on:
  schedule:
    # Run every hour to check for streak risks, inactive users, expiring challenges
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-notification-triggers:
    name: Check Notification Triggers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check notification triggers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "⏰ Checking notification triggers (hourly)..."
          
          # Call the Supabase edge function for trigger checks
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/check-notification-triggers" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Trigger check failed with code $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Notification triggers checked successfully"
          
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Hourly Notification Trigger Check Failed',
              body: 'The hourly notification trigger check failed. This affects:\n- Streak risk alerts\n- Inactive user notifications\n- Expiring challenge reminders\n\nPlease investigate immediately.',
              labels: ['bug', 'urgent', 'notifications']
            })

name: Daily Notifications - Morning Batch

on:
  schedule:
    # Run at 10:00 PM UTC (6:00 AM Philippines) - schedule all-day notifications before first one fires
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-morning-notifications:
    name: Generate Morning Notification Batch
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cancel stale pending notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🧹 Cancelling stale pending notifications older than 24 hours..."
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/cancel_stale_notifications" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' || true
          echo "✅ Stale notification cleanup done"

      - name: Schedule morning notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🌅 Scheduling morning notification batch (7 AM Philippines)..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/schedule-daily-notifications" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Morning notification scheduling failed with code $HTTP_CODE"
            exit 1
          fi

          echo "✅ Morning notifications scheduled"

      - name: Process notification queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📤 Processing notification queue (sending to devices)..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/process-notification-queue" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Queue processing failed with code $HTTP_CODE"
            exit 1
          fi

          echo "✅ Notification queue processed successfully"
          
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Morning Notification Batch Failed',
              body: 'The morning notification generation job (7 AM Philippines) failed. Please check the logs and investigate immediately.\n\nThis affects user engagement and retention.',
              labels: ['bug', 'urgent', 'notifications']
            })
